name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wizard/plugin.program.8nime.wizard/**'

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install semantic-release
        run: npm i -g semantic-release @semantic-release/exec @semantic-release/git @semantic-release/github

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Read released version
        id: meta
        if: steps.release.outcome == 'success'
        run: |
          ADDON_ID="plugin.program.8nime.wizard"
          VERSION=$(grep '<addon ' wizard/plugin.program.8nime.wizard/addon.xml | sed 's/.*version="\([^"]*\)".*/\1/')
          echo "addon_id=$ADDON_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package zip
        if: steps.meta.outcome == 'success' && steps.meta.outputs.version != ''
        run: bash scripts/package-wizard.sh

      - name: Upload to 8nime-repo releases
        if: steps.meta.outcome == 'success' && steps.meta.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          ADDON_ID="${{ steps.meta.outputs.addon_id }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ZIP="dist/${ADDON_ID}-${VERSION}.zip"
          gh release create "$ADDON_ID" --repo 8nime/8nime-repo \
            --title "$ADDON_ID" --notes "" 2>/dev/null || true
          gh release upload "$ADDON_ID" "$ZIP" --repo 8nime/8nime-repo --clobber
          # Also publish icon.png as a flat asset so Kodi can render the icon for
          # the not-yet-installed addon in the repository browse. Kodi resolves it
          # as {datadir}/<addon_id>/icon.png == releases/download/<tag>/icon.png.
          gh release upload "$ADDON_ID" "wizard/${ADDON_ID}/icon.png" --repo 8nime/8nime-repo --clobber

      - name: Notify 8nime-repo to update metadata
        if: steps.meta.outcome == 'success' && steps.meta.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          gh api repos/8nime/8nime-repo/dispatches \
            --method POST \
            -f event_type=addon-released \
            -f "client_payload[addon_id]=${{ steps.meta.outputs.addon_id }}" \
            -f "client_payload[version]=${{ steps.meta.outputs.version }}"
